name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build qt6-base-dev libarchive-dev zlib1g-dev

      - name: Install Windows Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja qt@6 libarchive zlib

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install --triplet x64-windows

      - name: Restore Libretro database cache
        uses: actions/cache@v4
        with:
          path: build/src/libretro-database-1.22.1
          key: libretro-database-1.22.1

      - name: Provision Libretro database
        shell: bash
        run: |
          if [ ! -d build/src/libretro-database-1.22.1/rdb ]; then
            mkdir -p build/src
            curl --fail --location --retry 3 --output /tmp/libretro-database.zip \
              https://github.com/libretro/libretro-database/archive/refs/tags/v1.22.1.zip
            echo "f98314970f42efdc4bb0d55606b23bec25b74660d1fe8f623eed1aa549e47d12  /tmp/libretro-database.zip" | sha256sum --check --status
            unzip -q /tmp/libretro-database.zip -d /tmp
            mv /tmp/libretro-database-1.22.1 build/src/libretro-database-1.22.1
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
